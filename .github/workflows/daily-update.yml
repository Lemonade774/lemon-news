name: Daily Lemon News Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install aiohttp beautifulsoup4 lxml
      - name: Validate source code
        run: |
          python -m py_compile skill.py
          python -m unittest discover -s tests -v
      - name: Generate daily report
        run: python skill.py
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      - name: Validate generated data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("news_data.json").read_text(encoding="utf-8"))
          items = payload.get("top_items", [])
          if len(items) != 10:
              raise SystemExit(f"日报条数校验失败：{len(items)}，期望 10 条")
          if not all(item.get("title") and item.get("url") for item in items):
              raise SystemExit("日报存在缺少标题或链接的条目")
          index = json.loads(Path("search_index.json").read_text(encoding="utf-8"))
          if not isinstance(index.get("items"), list):
              raise SystemExit("搜索索引格式错误")
          print(f"validated {len(items)} daily items and {len(index['items'])} indexed items")
          PY
      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html news_data.json search_index.json history/
          git diff --cached --quiet || git commit -m "chore: update daily report"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push attempt ${attempt} failed; rebasing onto origin/main"
            git pull --rebase origin main || exit 1
          done
          exit 1
